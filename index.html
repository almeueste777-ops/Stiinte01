<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Științe Sociale — Liceu FR</title>
<meta name="description" content="Aplicație PWA de studiu pentru liceu, filiera teoretică, profil umanist, specializarea Științe sociale, frecvență redusă.">
<meta name="color-scheme" content="light dark">
<!-- O SINGURĂ etichetă de culoare a barei de stare, pusă de bootstrap-ul de mai
     jos: tema poate fi FORȚATĂ din Setări, iar `media=(prefers-color-scheme)`
     ar rămâne agățat de preferința sistemului, nu de alegerea utilizatorului. -->
<meta name="theme-color" id="meta-tema" content="#F7EEE2">

<!-- ══ Bootstrap de temă — rulează ÎNAINTE de foaia de stil ═══════════════
     Preferințele vizuale (temă, contrast, mișcare, transparență, densitate,
     font, mărime) sunt atribute pe <html>. Le punem sincron, aici, ca prima
     pictură să fie deja corectă: dacă am aștepta app.js, un utilizator cu
     tema întunecată ar vedea o clipire albă la fiecare pornire.
     Valoarea „automat” se rezolvă din preferința sistemului. -->
<script>
(function(){
  var d = document.documentElement, s = {};
  try { s = (JSON.parse(localStorage.getItem('stiinte01:v1') || '{}').setari) || {}; } catch (e) {}
  var mq = function (q) { try { return matchMedia(q).matches; } catch (e) { return false; } };
  var tema = s.tema === 'luminos' || s.tema === 'intunecat'
      ? s.tema : (mq('(prefers-color-scheme: dark)') ? 'intunecat' : 'luminos');
  d.setAttribute('data-tema', tema);
  d.style.colorScheme = tema === 'intunecat' ? 'dark' : 'light';
  d.setAttribute('data-contrast',
      s.contrast === 'ridicat' || (s.contrast !== 'normal' && mq('(prefers-contrast: more)')) ? 'ridicat' : 'normal');
  d.setAttribute('data-miscare',
      s.miscare === 'redusa' || (s.miscare !== 'completa' && mq('(prefers-reduced-motion: reduce)')) ? 'redusa' : 'completa');
  d.setAttribute('data-transparenta',
      s.transparenta === 'redusa' || (s.transparenta !== 'completa' && mq('(prefers-reduced-transparency: reduce)')) ? 'redusa' : 'completa');
  d.setAttribute('data-densitate', s.densitate || 'confortabil');
  d.setAttribute('data-font', s.font || 'sistem');
  var m = Number(s.marimeText);
  if (m >= 80 && m <= 150) d.style.setProperty('--fs-scale', m / 100);
  var meta = document.getElementById('meta-tema');
  if (meta) meta.setAttribute('content', tema === 'intunecat' ? '#191310' : '#F7EEE2');
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<!-- Datele pornesc la drum odată cu CSS-ul, nu abia după ce rulează JS-ul.
     `crossorigin` e obligatoriu: fetch()-ul din app.js e în mod CORS, iar un
     preload fără atribut nu s-ar potrivi și s-ar descărca totul de două ori. -->
<link rel="preload" href="./data/curriculum.json" as="fetch" crossorigin>
<link rel="preload" href="./data/continut.json" as="fetch" crossorigin>
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- ?v= sparge intrările vechi din cache-ul HTTP (fișierele nu au amprentă în
     nume, iar înainte de v02.1 aveau max-age de 7 zile). Se crește ODATĂ cu
     versiunea CACHE din sw.js — CI-ul verifică sincronizarea. -->
<link rel="stylesheet" href="./assets/app.css?v=8">
</head>
<body>

    </svg>
  </button>
  <h1 id="page-title">Științe Sociale</h1>
  <span id="net-badge" class="badge" hidden>offline</span>
  <button id="btn-setari" class="icon-btn end" aria-label="Setări">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.95 1.95 0 1 1-3.9 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3.4a1.95 1.95 0 1 1 0-3.9h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.77.32h.08A1.6 1.6 0 0 0 10.22 3.6V3.4a1.95 1.95 0 1 1 3.9 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.95 1.95 0 1 1 0 3.9h-.09a1.6 1.6 0 0 0-1.45.98Z"/>
    </svg>
  </button>
</header>

<!-- .stage decupează ecranul care pleacă (clona) în timpul tranziției push/pop. -->
<div class="stage" id="stage">
  <main id="view" class="view" tabindex="-1"></main>
</div>

<nav class="tabbar" role="tablist" aria-label="Navigare principală">
  <!-- Pastila care alunecă sub tab-ul selectat. Absolut poziționată, deci nu
       intră în grila de 5 coloane. Poziția vine din --tab-i, pus de app.js. -->
  <span class="tab-ind" aria-hidden="true"></span>

  <!-- Acasă — casă -->
  <button class="tab" data-route="acasa" role="tab" aria-selected="true">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M3.6 10.6 12 4l8.4 6.6"/>
      <path d="M5.8 9.3V19a1.5 1.5 0 0 0 1.5 1.5h9.4a1.5 1.5 0 0 0 1.5-1.5V9.3"/>
      <path d="M9.9 20.5v-5.1a1.1 1.1 0 0 1 1.1-1.1h2a1.1 1.1 0 0 1 1.1 1.1v5.1"/>
    </svg>
    <span class="tab-label">Acasă</span>
  </button>

  <!-- Materii — straturi suprapuse -->
  <button class="tab" data-route="materii" role="tab" aria-selected="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M12 3.3 3.5 7.5 12 11.7l8.5-4.2L12 3.3Z"/>
      <path d="M3.5 12.1 12 16.3l8.5-4.2"/>
      <path d="M3.5 16.6 12 20.8l8.5-4.2"/>
    </svg>
    <span class="tab-label">Materii</span>
  </button>

  <!-- Antrenament — halteră: exercițiu, nu doar citit -->
  <button class="tab" data-route="antrenament" role="tab" aria-selected="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M4.2 9.4v5.2M7 7.6v8.8M17 7.6v8.8M19.8 9.4v5.2"/>
      <path d="M7 12h10"/>
    </svg>
    <span class="tab-label">Antrenez</span>
  </button>

  <!-- Test — clipboard cu bifă -->
  <button class="tab" data-route="test" role="tab" aria-selected="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M9 4.7H7.4A2.4 2.4 0 0 0 5 7.1v11.5a2.4 2.4 0 0 0 2.4 2.4h9.2a2.4 2.4 0 0 0 2.4-2.4V7.1a2.4 2.4 0 0 0-2.4-2.4H15"/>
      <rect x="9" y="2.7" width="6" height="4" rx="1.6"/>
      <path d="m8.9 13.6 2.2 2.2 4.4-4.5"/>
    </svg>
    <span class="tab-label">Test</span>
  </button>

  <!-- Plan — calendar cu grilă de puncte -->
  <button class="tab" data-route="plan" role="tab" aria-selected="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="3.4" y="5.3" width="17.2" height="15.3" rx="3.4"/>
      <path d="M3.4 10.2h17.2"/>
      <path d="M8.4 3.4v3.7M15.6 3.4v3.7"/>
      <path d="M8 13.9h.01M12 13.9h.01M16 13.9h.01"/>
      <path d="M8 17.4h.01M12 17.4h.01M16 17.4h.01"/>
    </svg>
    <span class="tab-label">Plan</span>
  </button>
</nav>

<script src="./assets/app.js?v=8"></script>
</body>
</html>
