name: Verificare

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validează fișierele JSON
        run: |
          for f in data/*.json manifest.webmanifest; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK  $f"
          done

      - name: Validează modulele de conținut
        run: |
          for f in data/module/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
          echo "OK  $(ls data/module/*.json | wc -l) module JSON"

      - name: Verifică structura conținutului
        run: node tools/verifica-continut.mjs

      - name: Verifică sincronizarea indexului cu modulele
        run: |
          node tools/construieste-index.mjs
          git diff --exit-code -- data/continut.json sw.js \
            || { echo "data/continut.json sau sw.js nu sunt regenerate; rulează tools/construieste-index.mjs"; exit 1; }

      - name: Verifică sintaxa JavaScript
        run: |
          node --check assets/app.js && echo "OK  assets/app.js"
          node --check sw.js         && echo "OK  sw.js"

      - name: Verifică structura foii de stil
        run: node tools/verifica-css.mjs assets/app.css

      - name: Verifică legăturile din vaultul Obsidian
        run: python3 tools/verifica_vault.py

      - name: Verifică fișierele obligatorii ale PWA
        run: |
          for f in index.html manifest.webmanifest sw.js tools/verifica-css.mjs \
                   icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            test -f "$f" && echo "OK  $f" || { echo "LIPSEȘTE $f"; exit 1; }
          done

      - name: Verifică fișierele din precache-ul service worker-ului
        run: |
          node -e "
            const fs = require('fs');
            const sw = fs.readFileSync('sw.js','utf8');
            // Precache-ul e împărțit: SHELL (cerut atomic) + MODULE (best-effort).
            const bloc = n => sw.match(new RegExp('const ' + n + ' = \\[([\\s\\S]*?)\\n\\];'))[1];
            const lista = (bloc('SHELL') + ',' + bloc('MODULE'))
              .replace(/\/\*[\s\S]*?\*\//g,'')
              .split(',').map(s => s.trim().replace(/^['\"]|['\"]\$/g,'')).filter(Boolean);
            if (lista.length < 60) { console.error('lista de precache pare trunchiată: ' + lista.length); process.exit(1); }
            let er = 0;
            for (const p of lista) {
              if (p === './') continue;
              const cale = p.replace(/^\.\//,'').replace(/\?.*\$/,'');
              if (!fs.existsSync(cale)) { console.error('LIPSEȘTE din repo: ' + p); er++; }
              else console.log('OK  ' + p);
            }
            process.exit(er ? 1 : 0);
          "

      - name: Verifică sincronizarea versiunilor CACHE ↔ ?v=
        run: |
          node -e "
            const fs = require('fs');
            const sw = fs.readFileSync('sw.js','utf8');
            const html = fs.readFileSync('index.html','utf8');
            const n = sw.match(/const CACHE = 'stiinte01-v(\d+)'/)[1];
            let er = 0;
            for (const f of ['assets/app.css','assets/app.js']) {
              const q = f + '?v=' + n;
              if (!html.includes('./' + q)) { console.error('index.html nu referă ./' + q); er++; }
              if (!sw.includes(\"'./\" + q + \"'\")) { console.error('SHELL din sw.js nu conține ./' + q); er++; }
            }
            console.log(er ? 'DESINCRONIZAT' : 'OK  CACHE v' + n + ' ↔ ?v=' + n);
            process.exit(er ? 1 : 0);
          "
