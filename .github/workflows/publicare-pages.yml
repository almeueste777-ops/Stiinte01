# Publică aplicația pe GitHub Pages la fiecare push pe main.
# Aplicația nu are pas de build: se publică rădăcina depozitului ca atare.
# Adresa rezultată: https://almeueste777-ops.github.io/Stiinte01/
#
# Metoda: ramura `gh-pages`, pe care GitHub Pages o servește automat.
# Varianta cu actions/deploy-pages a fost încercată prima și a picat la
# `configure-pages` cu „Resource not accessible by integration": GITHUB_TOKEN
# nu are voie să CREEZE situl Pages, doar un admin poate. Push-ul pe `gh-pages`
# nu are nevoie de situl preexistent — îl activează el însuși.
#
# `.nojekyll` e obligatoriu: fără el, Pages trece totul prin Jekyll, care
# aruncă fișierele cu underscore (_headers) și poate pica pe conținutul
# markdown din vault.
name: Publicare GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publică pe ramura gh-pages
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Publicare din main @ ${GITHUB_SHA}"
          git push --force origin gh-pages
